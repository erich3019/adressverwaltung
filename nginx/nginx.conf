# ============================================================
# nginx.conf – Reverse Proxy für die Adressverwaltungs-App
# ============================================================
#
# Architektur:
#   Browser → nginx :80/:443 → frontend:3000  (Next.js)
#                             → backend:8080   (ASP.NET Core OData)
#
# Routen:
#   /odata/*    → Backend (OData API)
#   /auth/*     → Backend (Login / Register)
#   /settings   → Backend (Einstellungen)
#   /*          → Frontend (Next.js)
#
# SSL:
#   Zertifikat liegt unter ./ssl/cert.pem und ./ssl/key.pem
#   Für lokale Entwicklung: selbstsigniertes Zertifikat (openssl)
#   Für Produktion: Let's Encrypt (certbot)
# ============================================================

# -------------------------------------------------------
# Server 1: HTTP → HTTPS Weiterleitung (Port 80)
# -------------------------------------------------------
server {
    listen 80;
    server_name localhost;

    # Alle HTTP-Anfragen permanent auf HTTPS umleiten
    return 301 https://$host$request_uri;
}

# -------------------------------------------------------
# Server 2: HTTPS mit SSL-Terminierung (Port 443)
# -------------------------------------------------------
server {
    listen 443 ssl;
    server_name localhost;

    # SSL-Zertifikat und Schlüssel
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Nur moderne TLS-Versionen erlauben
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Verbesserte Sicherheitsheader
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    # Maximale Upload-Grösse (für Formulare)
    client_max_body_size 10M;

    # -------------------------------------------------------
    # Backend-Routen: OData API
    # -------------------------------------------------------
    location /odata/ {
        proxy_pass         http://backend:8080/odata/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------
    # Backend-Routen: Authentifizierung (Login / Register)
    # -------------------------------------------------------
    location /auth/ {
        proxy_pass         http://backend:8080/auth/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------
    # Backend-Routen: Einstellungen
    # -------------------------------------------------------
    location /settings {
        proxy_pass         http://backend:8080/settings;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------
    # Frontend: Alle anderen Anfragen → Next.js
    # -------------------------------------------------------
    location / {
        proxy_pass         http://frontend:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket-Unterstützung (Next.js Hot Module Replacement)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
