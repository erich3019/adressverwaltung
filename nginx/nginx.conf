# ============================================================
# nginx.conf – Reverse Proxy für die Adressverwaltungs-App
# ============================================================
#
# Architektur:
#   Browser → nginx :80/:443 → frontend:3000  (Next.js)
#                             → backend:8080   (ASP.NET Core OData)
#
# Routen:
#   /odata/*    → Backend (OData API)
#   /auth/*     → Backend (Login / Register)
#   /settings   → Backend (Einstellungen)
#   /n8n/*      → n8n (eigenes Compose-Projekt ~/n8n-server, über das gemeinsame Netzwerk)
#   /*          → Frontend (Next.js)
#
# SSL:
#   Zertifikat liegt unter ./ssl/cert.pem und ./ssl/key.pem
#   Für lokale Entwicklung: Zertifikat einer lokalen Zertifizierungsstelle (mkcert)
#   Für Produktion: Let's Encrypt (certbot)
# ============================================================

# nginx-Version nicht in Antworten und Fehlerseiten preisgeben
server_tokens off;

# Schutz vor Passwort-Raten: höchstens 10 Anmeldeversuche pro Minute und Client-IP
limit_req_zone $binary_remote_addr zone=anmeldung:10m rate=10r/m;
limit_req_status 429;

# Content-Security-Policy:
# Seiten des Frontends bringen ihre eigene CSP mit (frontend/middleware.ts, mit einer
# Nonce pro Antwort). Alle übrigen Antworten – API, statische Dateien, Fehlerseiten –
# erhalten diese feste Richtlinie ohne Inline-Skripte.
map $upstream_http_content_security_policy $csp_ohne_nonce {
    ''      "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'";
    default "";
}

# -------------------------------------------------------
# Server 1: HTTP → HTTPS Weiterleitung (Port 80)
# -------------------------------------------------------
server {
    listen 80;
    server_name localhost;

    # Alle HTTP-Anfragen permanent auf HTTPS umleiten
    return 301 https://$host$request_uri;
}

# -------------------------------------------------------
# Server 2: HTTPS mit SSL-Terminierung (Port 443)
# -------------------------------------------------------
server {
    listen 443 ssl;
    server_name localhost;

    # SSL-Zertifikat und Schlüssel
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Nur moderne TLS-Versionen erlauben
    ssl_protocols       TLSv1.2 TLSv1.3;
    # TLS 1.2 nur mit Forward Secrecy (ECDHE) und AEAD-Verfahren – kein statisches RSA,
    # kein CBC, kein SHA-1. Die Verfahren von TLS 1.3 sind davon unabhängig immer sicher.
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    # Verbesserte Sicherheitsheader
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Nur setzen, wenn die Antwort keine eigene CSP mitbringt (siehe map oben);
    # ein leerer Wert erzeugt keinen Header.
    add_header Content-Security-Policy $csp_ohne_nonce always;

    # Maximale Upload-Grösse (für Formulare)
    client_max_body_size 10M;

    # -------------------------------------------------------
    # Backend-Routen: OData API
    # -------------------------------------------------------
    location /odata/ {
        proxy_pass         http://backend:8080/odata/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------
    # Backend-Routen: Authentifizierung (Login / Register)
    # -------------------------------------------------------
    location /auth/ {
        limit_req          zone=anmeldung burst=5 nodelay;
        proxy_pass         http://backend:8080/auth/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------
    # Backend-Routen: Einstellungen
    # -------------------------------------------------------
    location /settings {
        proxy_pass         http://backend:8080/settings;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------
    # Backend-Routen: Benutzerverwaltung
    # -------------------------------------------------------
    location /users {
        proxy_pass         http://backend:8080/users;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------
    # Frontend: Anmeldung über NextAuth (Credentials) – mit Ratenbegrenzung
    # -------------------------------------------------------
    location /api/auth/callback/credentials {
        limit_req          zone=anmeldung burst=5 nodelay;
        proxy_pass         http://frontend:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------
    # n8n (Compose-Projekt ~/n8n-server): Editor, REST-API, Webhooks unter /n8n/
    # -------------------------------------------------------
    # Der n8n-Container hängt zusätzlich am Netzwerk dieses Projekts (Alias "n8n").
    # Der Name wird erst bei der Anfrage aufgelöst (resolver + Variable), damit nginx
    # auch startet, wenn n8n nicht läuft; /n8n/ antwortet dann mit 502.
    location = /n8n {
        return 301 /n8n/;
    }

    location /n8n/ {
        resolver           127.0.0.11 valid=10s;
        set $n8n_upstream  http://n8n:5678;
        # Präfix entfernen: n8n (N8N_PATH=/n8n/) erwartet die Pfade ohne /n8n
        rewrite            ^/n8n/(.*)$ /$1 break;
        proxy_pass         $n8n_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket (Push-Verbindung des Editors) und lange Ausführungen
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_buffering    off;
        proxy_read_timeout 3600s;

        # add_header in einer location ersetzt die Header des server-Blocks: hier
        # dieselben ohne die feste Content-Security-Policy, die den n8n-Editor blockiert.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # -------------------------------------------------------
    # Frontend: Alle anderen Anfragen → Next.js
    # -------------------------------------------------------
    location / {
        proxy_pass         http://frontend:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket-Unterstützung (Next.js Hot Module Replacement)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
